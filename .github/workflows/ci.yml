name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg (QC tests call ffmpeg / ffprobe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Everything runs offline: publishers, Google Flow and Telegram are mocked, and the
      # tests that check the owner's own PC (Chrome, vault, OAuth secret) skip themselves.
      - name: Run test suite
        run: python -m pytest -q -rs tests/
